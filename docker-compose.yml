services:
  media-roulette:
    container_name: media-roulette

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      TZ: Europe/Zurich

      # Media-Roulette paths inside the container
      MOVIES_DIR: /data/movies
      SERIES_DIR: /data/tv

      # Persistent SQLite database
      DATABASE_PATH: /state/media_roulette.db

      # Application logging
      LOG_LEVEL: INFO

    volumes:
      # --------------------------------------------------------
      # Media library
      # Read-only: Media-Roulette must never modify your media.
      # --------------------------------------------------------

      - /mnt/user/data/media/movies:/data/movies:ro
      - /mnt/user/data/media/tv:/data/tv:ro

      # --------------------------------------------------------
      # Application state
      # SQLite database / persistent application data
      # --------------------------------------------------------

      - ./data:/state

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/test', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
