version: '3.8'

services:
  media-roulette:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: media-roulette
    restart: unless-stopped
    
    ports:
      - "8000:8000"
    
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=100M
      - /run:size=10M
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    
    volumes:
      - ./state:/state:rw
      - /mnt/data/movies:/mnt/data/movies:ro
      - /mnt/data/series:/mnt/data/series:ro
    
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@localhost}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-ChangeMeNow123!}
      - DATABASE_PATH=/state/media_roulette.db
      - MOVIES_DIR=/data/movies
      - SERIES_DIR=/data/series
      - SERVER_NAME=${SERVER_NAME:-}
      - URL_SCHEME=https
      - PORT=8000
    
    networks:
      - proxy-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  proxy-network:
    external: true
    name: proxy-network
