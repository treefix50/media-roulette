{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>😎 Media Roulette</h1>
    <p class="subtitle">Finde dein nächstes Lieblingsmedium – zufällig, lokal, schnell.</p>

    <div class="controls">
        <select id="kind-filter">
            <option value="">Alle</option>
            <option value="movie">Filme</option>
            <option value="series">Serien</option>
        </select>
        <select id="provider-filter">
            <option value="">Alle Anbieter</option>
        </select>
        <button id="spin-btn">🔀 Zufallsempfehlung</button>
    </div>

    <div id="status" class="secondary">Lade Statistiken...</div>

    <div id="result"></div>
</div>

<script>
const RECENT_LIMIT = 10;
const recent = [];

async function loadStats() {
    try {
        const res = await fetch('/api/stats');
        const stats = await res.json();
        document.getElementById('status').textContent =
            `${stats.total} Medien (${stats.movies} Filme, ${stats.series} Serien) • ${stats.providers.length} Anbieter`;

        const providerSelect = document.getElementById('provider-filter');
        if (Array.isArray(stats.providers)) {
            providerSelect.innerHTML = '<option value="">Alle Anbieter</option>';
            for (const provider of stats.providers) {
                const opt = document.createElement('option');
                opt.value = provider;
                opt.textContent = provider;
                providerSelect.appendChild(opt);
            }
        }
    } catch (err) {
        document.getElementById('status').textContent = 'Statistiken nicht verfügbar.';
    }
}

async function getRandomMedia() {
    const btn = document.getElementById('spin-btn');
    if (!btn) return;
    btn.disabled = true;

    const kind = document.getElementById('kind-filter')?.value || null;
    const provider = document.getElementById('provider-filter')?.value || null;
    const resultBox = document.getElementById('result');
    if (!resultBox) return;

    resultBox.className = 'result';
    resultBox.innerHTML = '<p>Lade Empfehlung...</p>';

    const exclude = recent.join('\n');
    const url = new URL('/api/random', window.location.origin);
    if (kind) url.searchParams.set('kind', kind);
    if (provider) url.searchParams.set('provider', provider);
    if (exclude) url.searchParams.set('exclude', exclude);

    try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data.success || !data.item) {
            resultBox.className = 'result';
            resultBox.innerHTML = `
                <h2>😕 Nichts gefunden</h2>
                <p>${escapeHtml(data.message)}</p>
            `;
            return;
        }

        const x = data.item;
        const key = `${x.kind}|${x.title}|${x.year || ''}|${x.provider || ''}`;
        recent.unshift(key);
        while (recent.length > RECENT_LIMIT) recent.pop();

        resultBox.className = 'result poster-card';
        resultBox.innerHTML = `
            <div class="type">${x.kind === 'movie' ? '🎬' : '📺'} ${x.kind === 'movie' ? 'FILM' : 'SERIE'}</div>
            <h2>${escapeHtml(x.title)}${x.year ? ` · ${x.year}` : ''}${x.rating != null ? ` · ⭐ ${Number(x.rating).toFixed(1)}` : ''}</h2>
            <div class="meta">${escapeHtml(x.provider)}${x.runtime ? ` · ${x.runtime} min` : ''}</div>
            ${x.genres ? `<div class="genres">${escapeHtml(x.genres)}</div>` : ''}
            <p>${x.plot ? escapeHtml(x.plot) : 'Keine Beschreibung in den vorhandenen Metadaten.'}</p>
            <button class="secondary" onclick="location.reload()">🔄 Noch eine Empfehlung</button>
        `;
    } catch (err) {
        resultBox.className = 'result';
        resultBox.innerHTML = `
            <h2>⚠️ Fehler</h2>
            <p>Die Empfehlung konnte gerade nicht geladen werden.</p>
        `;
    } finally {
        if (btn) btn.disabled = false;
    }
}

function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/'/g, '&#39;')
        .replace(/"/g, '&quot;');
}

document.addEventListener('DOMContentLoaded', () => {
    loadStats();

    const btn = document.getElementById('spin-btn');
    if (btn) {
        btn.addEventListener('click', getRandomMedia);
    }
});
</script>
{% endblock %}
