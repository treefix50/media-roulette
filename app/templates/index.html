{% extends "base.html" %}

{% block content %}
<style>
:root {
    --bg-primary: #0f0f1a;
    --bg-secondary: #1a1a2e;
    --bg-card: #16213e;
    --accent: #6d4aff;
    --accent-hover: #8f6bff;
    --text-primary: #e0e0e0;
    --text-secondary: #a0a0a0;
    --border: #2a2a4e;
    --success: #00d4aa;
    --warning: #ffae00;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    line-height: 1.6;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 40px 20px;
}

header {
    text-align: center;
    margin-bottom: 50px;
}

h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    margin-bottom: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent-hover));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.subtitle {
    color: var(--text-secondary);
    font-size: 1.1rem;
}

.stats-bar {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 30px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 30px;
}

.stat-item {
    text-align: center;
}

.stat-value {
    font-size: 2rem;
    font-weight: bold;
    color: var(--accent);
}

.stat-label {
    font-size: 0.9rem;
    color: var(--text-secondary);
}

.controls {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

select, button {
    padding: 14px 24px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.2s ease;
}

select:hover, button:hover:not(:disabled) {
    background: var(--bg-secondary);
    border-color: var(--accent);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#spin-btn {
    background: var(--accent);
    border-color: var(--accent);
    font-weight: bold;
    min-width: 200px;
}

#spin-btn:hover:not(:disabled) {
    background: var(--accent-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(109, 76, 170, 0.4);
}

.result-container {
    margin-top: 40px;
    min-height: 400px;
}

.loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 300px;
    color: var(--text-secondary);
    font-size: 1.2rem;
}

.spinner {
    width: 40px;
    height: 40px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-right: 15px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.poster-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 0;
    animation: slideUp 0.4s ease;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.poster-image {
    position: relative;
    background: #000;
    min-height: 450px;
}

.poster-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.poster-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    color: var(--text-secondary);
    background: var(--bg-secondary);
}

.media-info {
    padding: 30px;
}

.media-header {
    display: flex;
    align-items: flex-start;
    gap: 15px;
    margin-bottom: 20px;
}

.media-type {
    display: inline-block;
    padding: 6px 12px;
    background: var(--accent);
    color: #fff;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.media-title {
    font-size: 2rem;
    font-weight: bold;
    color: var(--text-primary);
    margin: 0;
    flex: 1;
}

.media-year {
    color: var(--text-secondary);
    font-size: 1.2rem;
}

.meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
    padding: 20px;
    background: var(--bg-secondary);
    border-radius: 12px;
}

.meta-item {
    display: flex;
    flex-direction: column;
}

.meta-label {
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-bottom: 4px;
}

.meta-value {
    font-size: 1.1rem;
    font-weight: bold;
    color: var(--text-primary);
}

.genres {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
}

.genre-tag {
    padding: 6px 14px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 0.9rem;
    color: var(--text-secondary);
}

.plot {
    font-size: 1rem;
    line-height: 1.8;
    color: var(--text-secondary);
    margin-bottom: 20px;
    max-height: 150px;
    overflow-y: auto;
}

.action-buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.btn-secondary {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
}

.btn-secondary:hover:not(:disabled) {
    background: var(--accent);
    color: #fff;
}

.empty-state {
    text-align: center;
    padding: 60px 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
}

.empty-icon {
    font-size: 4rem;
    margin-bottom: 20px;
}

.empty-title {
    font-size: 1.5rem;
    margin-bottom: 10px;
}

.empty-message {
    color: var(--text-secondary);
}

.error-state {
    background: rgba(255, 80, 80, 0.1);
    border: 1px solid rgba(255, 80, 80, 0.3);
}

.error-icon {
    color: #ff5050;
}

/* Responsive Design */
@media (max-width: 900px) {
    .poster-card {
        grid-template-columns: 1fr;
    }
    
    .poster-image {
        min-height: 350px;
        max-width: 400px;
        margin: 0 auto;
    }
    
    .media-info {
        padding: 20px;
    }
    
    .media-title {
        font-size: 1.5rem;
    }
    
    .controls {
        flex-direction: column;
    }
    
    select, button {
        width: 100%;
    }
}

@media (max-width: 600px) {
    .container {
        padding: 20px 15px;
    }
    
    h1 {
        font-size: 1.8rem;
    }
    
    .stats-bar {
        gap: 15px;
        padding: 15px;
    }
    
    .stat-value {
        font-size: 1.5rem;
    }
    
    .meta-grid {
        grid-template-columns: 1fr 1fr;
    }
    
    .action-buttons {
        flex-direction: column;
    }
    
    .btn-secondary, #spin-btn {
        width: 100%;
    }
}
</style>

<header>
    <h1>😎 Media Roulette</h1>
    <p class="subtitle">Finde dein nächstes Lieblingsmedium – zufällig, lokal, ohne Entscheidungsmüdigkeit</p>
</header>

<div class="stats-bar" id="stats">
    <div class="stat-item">
        <div class="stat-value" id="total-count">-</div>
        <div class="stat-label">Medien</div>
    </div>
    <div class="stat-item">
        <div class="stat-value" id="movies-count">-</div>
        <div class="stat-label">Filme</div>
    </div>
    <div class="stat-item">
        <div class="stat-value" id="series-count">-</div>
        <div class="stat-label">Serien</div>
    </div>
    <div class="stat-item">
        <div class="stat-value" id="providers-count">-</div>
        <div class="stat-label">Anbieter</div>
    </div>
</div>

<div class="controls">
    <select id="kind-filter">
        <option value="">Alle Medien</option>
        <option value="movie">🎬 Nur Filme</option>
        <option value="series">📺 Nur Serien</option>
    </select>
    <select id="provider-filter">
        <option value="">Alle Anbieter</option>
    </select>
    <button id="spin-btn">🔀 Zufallsempfehlung</button>
</div>

<div class="result-container" id="result">
    <div class="loading">
        <div class="spinner"></div>
        <span>Klicke auf "Zufallsempfehlung" um zu starten</span>
    </div>
</div>

<script>
const RECENT_LIMIT = 10;
const recent = [];

function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/'/g, '&#39;')
        .replace(/"/g, '&quot;');
}

function getPosterUrl(item) {
    // TMDB Poster URL aus NFO generieren
    if (item.tmdbid) {
        const kindPrefix = item.kind === 'movie' ? 'movie' : 'tv';
        return `https://image.tmdb.org/t/p/w500/${kindPrefix}/${item.tmdbid}.jpg`;
    }
    // Lokales Poster (falls vorhanden)
    if (item.local_poster) {
        return item.local_poster;
    }
    // Fallback auf Platzhalter
    return null;
}

function renderPoster(item) {
    const posterSrc = getPosterUrl(item);
    
    if (posterSrc) {
        return `<div class="poster-image"><img src="${escapeHtml(posterSrc)}" alt="${escapeHtml(item.title)}" onerror="this.parentElement.innerHTML='<div class=\\'poster-placeholder\\'>🎬</div>'"></div>`;
    } else {
        const icon = item.kind === 'movie' ? '🎬' : '📺';
        return `<div class="poster-image"><div class="poster-placeholder">${icon}</div></div>`;
    }
}

async function loadStats() {
    try {
        const res = await fetch('/api/stats');
        const stats = await res.json();
        
        document.getElementById('total-count').textContent = stats.total;
        document.getElementById('movies-count').textContent = stats.movies;
        document.getElementById('series-count').textContent = stats.series;
        document.getElementById('providers-count').textContent = stats.providers.length;
        
        // Provider-Dropdown auffüllen
        const providerSelect = document.getElementById('provider-filter');
        if (Array.isArray(stats.providers)) {
            providerSelect.innerHTML = '<option value="">Alle Anbieter</option>';
            stats.providers.forEach(provider => {
                const opt = document.createElement('option');
                opt.value = provider;
                opt.textContent = provider.charAt(0).toUpperCase() + provider.slice(1);
                providerSelect.appendChild(opt);
            });
        }
    } catch (err) {
        console.error('Stats loading failed:', err);
        document.querySelector('.stats-bar').innerHTML = '<div class="empty-message">Statistiken nicht verfügbar</div>';
    }
}

async function getRandomMedia() {
    const btn = document.getElementById('spin-btn');
    const resultBox = document.getElementById('result');
    
    if (!btn || !resultBox) return;
    
    btn.disabled = true;
    
    const kind = document.getElementById('kind-filter')?.value || null;
    const provider = document.getElementById('provider-filter')?.value || null;
    const exclude = recent.join('\\n');
    
    const url = new URL('/api/random', window.location.origin);
    if (kind) url.searchParams.set('kind', kind);
    if (provider) url.searchParams.set('provider', provider);
    if (exclude) url.searchParams.set('exclude', exclude);
    
    // Lade-Animation
    resultBox.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            <span>Suche Empfehlung...</span>
        </div>
    `;
    
    try {
        const res = await fetch(url);
        const data = await res.json();
        
        if (!data.success || !data.item) {
            resultBox.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">😕</div>
                    <div class="empty-title">Nichts gefunden</div>
                    <div class="empty-message">${escapeHtml(data.message)}</div>
                    <button onclick="location.reload()" class="btn-secondary" style="margin-top:20px">Seite neu laden</button>
                </div>
            `;
            return;
        }
        
        const item = data.item;
        const key = `${item.kind}|${item.title}|${item.year || ''}|${item.provider || ''}`;
        recent.unshift(key);
        while (recent.length > RECENT_LIMIT) recent.pop();
        
        // Titel anzeigen (NICHT Provider!)
        resultBox.innerHTML = `
            <div class="poster-card">
                ${renderPoster(item)}
                <div class="media-info">
                    <div class="media-header">
                        <span class="media-type">${item.kind === 'movie' ? 'Film' : 'Serie'}</span>
                        <h2 class="media-title">${escapeHtml(item.title)}</h2>
                        ${item.year ? `<span class="media-year">(${item.year})</span>` : ''}
                    </div>
                    
                    <div class="meta-grid">
                        <div class="meta-item">
                            <span class="meta-label">Anbieter</span>
                            <span class="meta-value">${escapeHtml(item.provider)}</span>
                        </div>
                        ${item.rating ? `
                        <div class="meta-item">
                            <span class="meta-label">Rating</span>
                            <span class="meta-value">⭐ ${Number(item.rating).toFixed(1)}</span>
                        </div>
                        ` : ''}
                        ${item.runtime ? `
                        <div class="meta-item">
                            <span class="meta-label">Laufzeit</span>
                            <span class="meta-value">${Math.round(item.runtime / 60)} Min</span>
                        </div>
                        ` : ''}
                    </div>
                    
                    ${item.genres ? `
                        <div class="genres">
                            ${item.genres.split(', ').map(g => `<span class="genre-tag">${escapeHtml(g)}</span>`).join('')}
                        </div>
                    ` : ''}
                    
                    ${item.plot ? `
                        <div class="plot">${escapeHtml(item.plot)}</div>
                    ` : ''}
                    
                    <div class="action-buttons">
                        <button id="another-btn">🔀 Noch eine Empfehlung</button>
                        <button class="btn-secondary" onclick="location.reload()">🔄 Neu starten</button>
                    </div>
                </div>
            </div>
        `;
        
        // Button für neue Empfehlung
        const anotherBtn = document.getElementById('another-btn');
        if (anotherBtn) {
            anotherBtn.addEventListener('click', getRandomMedia);
        }

    } catch (err) {
        console.error('Error:', err);
        resultBox.innerHTML = `
            <div class="empty-state error-state">
                <div class="empty-icon error-icon">⚠️</div>
                <div class="empty-title">Fehler</div>
                <div class="empty-message">Die Empfehlung konnte nicht geladen werden.</div>
            </div>
        `;
    } finally {
        btn.disabled = false;
    }
}

document.addEventListener('DOMContentLoaded', () => {
    loadStats();
    
    const spinBtn = document.getElementById('spin-btn');
    if (spinBtn) {
        spinBtn.addEventListener('click', getRandomMedia);
    }
});
</script>
{% endblock %}
